[build-system]
requires = ["setuptools>=77", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "pykardia"
dynamic = ["version"]
description = "Plugin framework with revertible effects and reactive services"
readme = "README.md"
requires-python = ">=3.10"
dependencies = ["PyYAML>=6.0.3,<7", "watchdog>=6,<7", "wasmtime==34.0.0", "typing-extensions>=4.13,<5"]
license = "GPL-3.0-only AND (MIT OR Apache-2.0)"
license-files = ["LICENSE", "NOTICE", "pykardia/guest/LICENSE-MIT", "pykardia/guest/LICENSE-APACHE"]

[project.scripts]
pykardia = "pykardia.cli:main"

[project.optional-dependencies]
export = ["cffi>=2.1,<3", "setuptools>=77"]
dev = ["async-timeout>=5,<6", "build>=1.5.0", "cffi>=2.1,<3", "setuptools>=77", "ruff>=0.17.1", "ty>=0.0.88"]

[tool.setuptools.dynamic]
version = {attr = "pykardia.version.__version__"}

[tool.setuptools.packages.find]
where = ["."]
include = ["pykardia", "pykardia.*"]

[tool.setuptools.package-data]
pykardia = ["py.typed", "guest/templates/*.c", "guest/LICENSE-*"]

[tool.ruff]
target-version = "py310"
line-length = 100
src = ["."]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "ANN", "D", "TID252"]
# The project requires docstrings on every handwritten signature, including overloads.
ignore = ["D418"]

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.ruff.lint.flake8-tidy-imports]
ban-relative-imports = "all"

[tool.ty.environment]
python-version = "3.10"

[tool.ty.src]
include = ["pykardia", "tests", "examples", "scripts"]
