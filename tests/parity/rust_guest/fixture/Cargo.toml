[package]
name = "rust-guest"
version = "0.0.0"
edition = "2024"
license = "GPL-3.0-only"
publish = false

[lib]
crate-type = ["cdylib", "rlib"]

[[bin]]
name = "rust-guest-process"
path = "src/main.rs"

[[bin]]
name = "rust-guest-v1"
path = "src/v1.rs"

[dependencies]
kardia-guest = { path = "../sdk" }
serde_json = "1"

[features]
v2 = []
kardia-names = []

[workspace]
